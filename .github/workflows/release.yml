name: Release

# The release is made by itself when a new versionName in app/build.gradle.kts
# reaches main (there is no release v<version> yet). It can also be started by
# hand (Actions -> Release -> Run workflow) or by pushing a tag v1.2.3.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(sed -n 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"\(.*\)"$/\1/p' app/build.gradle.kts | head -n1)
          test -n "$V"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$V" ]; then echo "The tag does not match versionName $V"; exit 1; fi
          P=true
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = branch ] && gh release view "v$V" >/dev/null 2>&1; then P=false; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "publish=$P" >> "$GITHUB_OUTPUT"
          echo "Version $V, publish: $P"

  release:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v5
      - name: Version
        run: echo "VERSION=${{ needs.plan.outputs.version }}" >> "$GITHUB_ENV"
      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/tukk.jks"
          echo "TUKK_KEYSTORE_FILE=$RUNNER_TEMP/tukk.jks" >> "$GITHUB_ENV"
          echo "Key store file: $(wc -c < "$RUNNER_TEMP/tukk.jks") bytes"
          # A password pasted with a stray space or line break is a common mistake: trim it.
          trim() { printf '%s' "$1" | tr -d '\r\n' | sed 's/^ *//;s/ *$//'; }
          trim "$STORE_PASSWORD" > "$RUNNER_TEMP/store.pw"
          if ! keytool -list -keystore "$RUNNER_TEMP/tukk.jks" -storepass:file "$RUNNER_TEMP/store.pw" > "$RUNNER_TEMP/keytool.out" 2>&1; then
            sed -n '1,3p' "$RUNNER_TEMP/keytool.out"
            echo "The key store password in the secret does not open the key store"; exit 1
          fi
          sed -n '1,6p' "$RUNNER_TEMP/keytool.out"
          echo "TUKK_KEYSTORE_PASSWORD=$(cat "$RUNNER_TEMP/store.pw")" >> "$GITHUB_ENV"
          echo "TUKK_KEY_PASSWORD=$(trim "$KEY_PASSWORD")" >> "$GITHUB_ENV"
      - name: Test and build
        env:
          TUKK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          ./gradlew --no-daemon test :app:assembleRelease :app:bundleRelease --stacktrace
          mkdir -p dist
          cp "app/build/outputs/apk/release/tukk-$VERSION-release.apk" "dist/tukk-$VERSION.apk"
          cp "app/build/outputs/bundle/release/tukk-$VERSION-release.aab" "dist/tukk-$VERSION.aab"
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '$0 ~ "^## " { p = ($2 == v) ; next } p' CHANGELOG.md > notes.md
          test -s notes.md || echo "Tukk $VERSION" > notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" "dist/tukk-$VERSION.apk" "dist/tukk-$VERSION.aab" --clobber
          else
            gh release create "v$VERSION" "dist/tukk-$VERSION.apk" "dist/tukk-$VERSION.aab" --target "$GITHUB_SHA" --title "Tukk $VERSION" --notes-file notes.md
          fi
