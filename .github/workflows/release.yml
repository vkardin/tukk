name: Release

# Pushing a tag v1.2.3 builds the signed APK and publishes the release.
# The tag has to match versionName in app/build.gradle.kts.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v5
      - name: Check the tag matches versionName
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "versionName = \"$version\"" app/build.gradle.kts || { echo "tag $version does not match versionName"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tukk.jks"
          echo "TUKK_KEYSTORE_FILE=$RUNNER_TEMP/tukk.jks" >> "$GITHUB_ENV"
      - name: Test and build
        env:
          TUKK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TUKK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TUKK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon test :app:assembleRelease :app:bundleRelease --stacktrace
          mkdir -p dist
          cp "app/build/outputs/apk/release/tukk-$VERSION-release.apk" "dist/tukk-$VERSION.apk"
          cp "app/build/outputs/bundle/release/tukk-$VERSION-release.aab" "dist/tukk-$VERSION.aab"
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '$0 ~ "^## " { p = ($2 == v) ; next } p' CHANGELOG.md > notes.md
          test -s notes.md || echo "Tukk $VERSION" > notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "dist/tukk-$VERSION.apk" "dist/tukk-$VERSION.aab" --title "Tukk $VERSION" --notes-file notes.md
